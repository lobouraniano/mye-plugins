name: Build macOS (VST3 + AU)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target Eco_VST3 Eco_AU -- -quiet

      - name: Read version
        run: echo "ECO_VERSION=$(head -1 plugins/eco/VERSION)" >> $GITHUB_ENV

      - name: Ad-hoc sign and package
        run: |
          mkdir -p dist/VST3 dist/Components
          cp -R "build/plugins/eco/Eco_artefacts/Release/VST3/MYE Eco.vst3" dist/VST3/
          cp -R "build/plugins/eco/Eco_artefacts/Release/AU/MYE Eco.component" dist/Components/
          codesign --force --deep -s - "dist/VST3/MYE Eco.vst3"
          codesign --force --deep -s - "dist/Components/MYE Eco.component"
          cp INSTALL.md dist/
          ditto -c -k --sequesterRsrc --keepParent dist MYE-Eco-mac.zip
          cp MYE-Eco-mac.zip "MYE-Eco-v${ECO_VERSION}-mac.zip"

      - name: Publish as the 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # versioned release (kept forever)
          if ! gh release view "eco-v${ECO_VERSION}" >/dev/null 2>&1; then
            gh release create "eco-v${ECO_VERSION}" "MYE-Eco-v${ECO_VERSION}-mac.zip" --title "MYE Eco v${ECO_VERSION}" --notes "Ver CHANGELOG.md" --latest=false
          fi
          # rolling 'latest' release (stable download link)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MYE-Eco-mac.zip --title "MYE plugins — latest (Eco v${ECO_VERSION})" --notes "Build automático desde main. Eco v${ECO_VERSION}. Instrucciones en INSTALL.md dentro del zip." --latest
