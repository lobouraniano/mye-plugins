name: Build macOS (VST3 + AU)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGINS: "Estribo Martillo Yunque Timpano"

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal arm64 + x86_64)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          TARGETS=""
          for P in $PLUGINS; do TARGETS="$TARGETS ${P}_VST3 ${P}_AU"; done
          cmake --build build --config Release --target $TARGETS -- -quiet

      - name: Sign (ad-hoc) and package
        run: |
          mkdir -p dist/VST3 dist/Components
          echo "# Versiones" > dist/VERSIONES.txt
          for P in $PLUGINS; do
            LOWER=$(echo $P | tr '[:upper:]' '[:lower:]')
            V=$(head -1 plugins/$LOWER/VERSION)
            echo "MYE $P $V" >> dist/VERSIONES.txt
            ART="build/plugins/$LOWER/${P}_artefacts/Release"
            cp -R "$ART/VST3/MYE $P.vst3" dist/VST3/
            cp -R "$ART/AU/MYE $P.component" dist/Components/
            codesign --force --deep -s - "dist/VST3/MYE $P.vst3"
            codesign --force --deep -s - "dist/Components/MYE $P.component"
            # single-plugin zip for its versioned release
            mkdir -p "one-$P/VST3" "one-$P/Components"
            cp -R "dist/VST3/MYE $P.vst3" "one-$P/VST3/"
            cp -R "dist/Components/MYE $P.component" "one-$P/Components/"
            cp INSTALL.md "one-$P/"
            ditto -c -k --sequesterRsrc --keepParent "one-$P" "MYE-$P-v$V-mac.zip"
          done
          cp INSTALL.md dist/
          ditto -c -k --sequesterRsrc --keepParent dist MYE-plugins-mac.zip
          cat dist/VERSIONES.txt

      - name: Publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # one-time fix: Eco "0.2.0" was really 0.1.1
          if gh release view eco-v0.2.0 >/dev/null 2>&1; then
            gh release edit eco-v0.2.0 --tag eco-v0.1.1 --title "MYE Eco v0.1.1" --notes "Eco 0.1.1 (publicado antes por error como 0.2.0)."
            gh api -X DELETE repos/${{ github.repository }}/git/refs/tags/eco-v0.2.0 || true
          fi
          # versioned release per plugin (kept forever, created once per version)
          for P in $PLUGINS; do
            LOWER=$(echo $P | tr '[:upper:]' '[:lower:]')
            V=$(head -1 plugins/$LOWER/VERSION)
            if ! gh release view "$LOWER-v$V" >/dev/null 2>&1; then
              gh release create "$LOWER-v$V" "MYE-$P-v$V-mac.zip" --title "MYE $P v$V" --notes "Ver CHANGELOG.md" --latest=false
            fi
          done
          # rolling 'latest' with all plugins (stable link)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MYE-plugins-mac.zip --title "MYE plugins — latest" --notes "$(cat dist/VERSIONES.txt)" --latest
